<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Omeyme Cherif Ahmed — Portfolio</title>
<meta name="description" content="Omeyme Cherif Ahmed — Computer Science Student, MIAGE, FST Université de Nouakchott. Future AI Engineer." />
<meta property="og:title" content="Omeyme Cherif Ahmed — Portfolio" />
<meta property="og:description" content="Computer Science Student | Business Information Systems | Future AI Engineer" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;500;600;700&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
  :root{
    --bg:#0a0a0c; --bg-soft:#101014; --panel:rgba(255,255,255,0.045); --panel-border:rgba(255,255,255,0.09);
    --text:#f5f5f7; --text-dim:#98989f; --text-faint:#5c5c63;
    --gold:#c9a227; --gold-soft:rgba(201,162,39,0.16);
    --blue:#4f7cff; --blue-soft:rgba(79,124,255,0.16);
    --font-body:'Inter',sans-serif; --font-display:'Poppins',sans-serif;
  }
  [data-theme="light"]{
    --bg:#f3f3f1; --bg-soft:#eae9e5; --panel:rgba(10,10,12,0.035); --panel-border:rgba(10,10,12,0.10);
    --text:#0e0e10; --text-dim:#5a5a60; --text-faint:#9c9ca2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    min-height:100vh; overflow-x:hidden; transition:background .5s ease, color .5s ease;
    line-height:1.5;
  }
  ::selection{ background:var(--gold-soft); color:var(--text); }
  a{ color:inherit; }
  button{ font-family:inherit; }
  img,svg{ display:block; }
  .display{ font-family:var(--font-display); }
  .mono{ font-family:'JetBrains Mono',monospace; direction:ltr; unicode-bidi:embed; }
  .wrap{ max-width:1152px; margin:0 auto; padding:0 24px; }
  .bg-grid{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(var(--panel-border) 1px, transparent 1px), linear-gradient(90deg, var(--panel-border) 1px, transparent 1px);
    background-size:44px 44px; opacity:.5;
  }
  [data-theme="light"] .bg-grid{ opacity:.6; }
  .blob{ position:fixed; border-radius:50%; filter:blur(10px); pointer-events:none; z-index:0; }
  .blob-gold{ top:-10%; inset-inline-end:-10%; width:520px; height:520px; background:radial-gradient(circle, var(--gold) 0%, transparent 70%); opacity:.13; }
  .blob-blue{ bottom:-15%; inset-inline-start:-10%; width:560px; height:560px; background:radial-gradient(circle, var(--blue) 0%, transparent 70%); opacity:.11; }
  .glass{ background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .glow-gold:hover{ box-shadow:0 0 0 1px rgba(201,162,39,.34), 0 8px 40px -8px rgba(201,162,39,.27); }
  .glow-blue:hover{ box-shadow:0 0 0 1px rgba(79,124,255,.34), 0 8px 40px -8px rgba(79,124,255,.27); }
  .chip{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.03em; }
  .focus-ring:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:8px; }
  .btn{ cursor:pointer; border:none; }

  /* header */
  header{ position:fixed; top:0; left:0; right:0; z-index:50; border-bottom:1px solid transparent; transition:all .4s ease; }
  header.scrolled{ background:var(--panel); border-bottom-color:var(--panel-border); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .nav-inner{ height:64px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-size:14px; letter-spacing:.08em; background:none; border:none; color:var(--text); cursor:pointer; }
  .logo span{ color:var(--gold); }
  nav.desktop-nav{ display:none; align-items:center; gap:32px; }
  nav.desktop-nav button{ background:none; border:none; cursor:pointer; font-size:13px; color:var(--text-dim); transition:color .25s; }
  nav.desktop-nav button:hover{ color:var(--text); }
  @media(min-width:768px){ nav.desktop-nav{ display:flex; } .mobile-toggle{ display:none !important; } }

  .icon-btn{ width:36px; height:36px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--panel-border); background:var(--panel); color:var(--text); cursor:pointer; }
  .lang-btn{ display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--panel-border); background:var(--panel); color:var(--text); cursor:pointer; font-size:12px; }
  .lang-menu{ position:absolute; top:44px; border-radius:14px; padding:6px; min-width:132px; z-index:60; box-shadow:0 20px 50px -12px rgba(0,0,0,.4); display:none; }
  .lang-menu.open{ display:block; }
  .lang-menu button{ display:flex; align-items:center; justify-content:space-between; width:100%; padding:8px 10px; border-radius:8px; border:none; background:transparent; color:var(--text); font-size:12.5px; cursor:pointer; }
  .lang-menu button.active{ background:var(--gold-soft); color:var(--gold); }
  .mobile-panel{ overflow:hidden; max-height:0; transition:max-height .3s ease; border-top:1px solid transparent; }
  .mobile-panel.open{ max-height:320px; border-top-color:var(--panel-border); }
  .mobile-panel .inner{ display:flex; flex-direction:column; padding:16px 24px; gap:2px; }
  .mobile-panel button{ text-align:start; padding:10px 4px; background:none; border:none; color:var(--text-dim); font-size:14px; cursor:pointer; }

  /* hero */
  #hero{ padding:144px 0 96px; position:relative; z-index:1; }
  @media(min-width:768px){ #hero{ padding:190px 0 128px; } }
  .hero-grid{ display:grid; gap:64px; align-items:center; }
  @media(min-width:768px){ .hero-grid{ grid-template-columns:1.1fr .9fr; } }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:16px; color:var(--gold); }
  .eyebrow.blue{ color:var(--blue); }
  .eyebrow .rule{ width:16px; height:1px; background:currentColor; }
  h1.name{ font-size:clamp(2.4rem,6vw,4.4rem); font-weight:600; line-height:1.05; letter-spacing:-.02em; }
  h1.name .dim{ color:var(--text-dim); }
  .tagline{ margin-top:22px; font-size:13px; color:var(--text-dim); line-height:1.9; max-width:460px; }
  .hero-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:40px; }
  .btn-gold{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; background:var(--gold); color:#0a0a0c; font-size:13.5px; font-weight:600; transition:transform .25s, box-shadow .25s; }
  .btn-gold:hover{ transform:translateY(-2px); box-shadow:0 10px 30px -8px rgba(201,162,39,.6); }
  .btn-ghost{ padding:12px 22px; border-radius:999px; font-size:13.5px; color:var(--text); font-weight:500; }

  /* id card */
  .id-card{ border-radius:24px; padding:30px; position:relative; overflow:hidden; transition:transform .3s ease-out; box-shadow:0 30px 80px -30px rgba(0,0,0,.5); direction:ltr; transform-style:preserve-3d; }
  .id-sweep{ position:absolute; inset:0; background:linear-gradient(115deg, transparent 30%, rgba(201,162,39,.13) 45%, rgba(79,124,255,.1) 55%, transparent 70%); pointer-events:none; transition:transform .3s ease-out; }
  .id-top{ display:flex; align-items:center; justify-content:space-between; position:relative; }
  .id-mid{ margin:28px 0; position:relative; }
  .id-mid p:first-child{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-faint); letter-spacing:.1em; }
  .id-mid p.name{ font-family:'Poppins',sans-serif; font-size:20px; font-weight:600; margin-top:4px; }
  .id-mid p:last-child{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); margin-top:8px; }
  .id-bottom{ display:flex; align-items:flex-end; justify-content:space-between; position:relative; }
  .dotgrid{ display:grid; grid-template-columns:repeat(8,1fr); gap:3px; width:96px; }
  .dotgrid span{ width:100%; padding-bottom:100%; border-radius:1px; background:var(--panel-border); }
  .verified-chip{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); border:1px solid rgba(201,162,39,.27); padding:6px 12px; border-radius:999px; }

  /* sections */
  section.block{ padding:56px 0; position:relative; z-index:1; }
  section.block h2{ font-size:clamp(1.6rem,3vw,2.2rem); font-weight:600; letter-spacing:-.01em; margin-bottom:44px; line-height:1.3; }
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  /* about */
  .about-grid{ display:grid; gap:48px; align-items:start; }
  @media(min-width:768px){ .about-grid{ grid-template-columns:.9fr 1.1fr; gap:80px; } }
  .about-grid h2{ margin-bottom:0; }
  .about-p{ color:var(--text-dim); font-size:15.5px; line-height:1.9; margin-top:18px; }
  .about-p:first-child{ margin-top:0; }
  .about-p strong{ color:var(--text); font-weight:600; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
  .tag-row span{ padding:7px 13px; border-radius:999px; color:var(--text-dim); }

  /* skills */
  .skills-grid{ display:grid; gap:20px; grid-template-columns:1fr; }
  @media(min-width:640px){ .skills-grid{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ .skills-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .skill-card{ border-radius:18px; padding:26px; transition:box-shadow .35s, transform .35s; }
  .skill-card:hover{ transform:translateY(-4px); }
  .skill-icon{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .skill-card h3{ font-size:15.5px; font-weight:600; margin-bottom:14px; }
  .skill-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .skill-tags span{ color:var(--text-dim); padding:5px 10px; border-radius:8px; border:1px solid var(--panel-border); }

  /* projects */
  .projects-grid{ display:grid; gap:20px; grid-template-columns:1fr; }
  @media(min-width:768px){ .projects-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .project-card{ border-radius:18px; padding:26px; border-style:dashed !important; display:flex; flex-direction:column; transition:box-shadow .35s, transform .35s; }
  .project-card:hover{ transform:translateY(-4px); }
  .project-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .plus-badge{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--gold-soft); color:var(--gold); }
  .project-card h3{ font-size:16px; font-weight:600; margin-bottom:10px; }
  .project-card p{ font-size:13.5px; color:var(--text-dim); line-height:1.7; flex-grow:1; }

  /* education */
  .edu-card{ border-radius:22px; padding:36px 32px; position:relative; overflow:hidden; }
  .edu-glow{ position:absolute; top:-60px; inset-inline-end:-60px; width:180px; height:180px; background:radial-gradient(circle, var(--gold-soft), transparent 70%); }
  .edu-inner{ display:flex; flex-direction:column; gap:20px; position:relative; }
  @media(min-width:768px){ .edu-inner{ flex-direction:row; align-items:center; gap:24px; } }
  .edu-icon{ width:54px; height:54px; border-radius:14px; background:var(--gold-soft); color:var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .edu-title{ font-size:17px; font-weight:600; }
  .edu-title span{ color:var(--text-dim); font-weight:500; }
  .edu-sub{ font-size:14px; color:var(--text-dim); margin-top:6px; }
  .edu-loc{ display:flex; align-items:center; gap:6px; margin-top:12px; color:var(--text-faint); font-size:12.5px; }
  .edu-status{ padding:8px 16px; border-radius:999px; border:1px solid var(--panel-border); color:var(--text-dim); white-space:nowrap; }

  /* certifications */
  .certs-grid{ display:grid; gap:20px; grid-template-columns:1fr; }
  @media(min-width:640px){ .certs-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .cert-card{ border-radius:18px; padding:30px; height:160px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border-style:dashed !important; color:var(--text-faint); }
  .cert-card svg{ margin-bottom:10px; opacity:.7; }

  /* contact */
  .contact-card{ border-radius:26px; padding:56px 32px; text-align:center; position:relative; overflow:hidden; }
  .contact-glow{ position:absolute; top:-30%; left:50%; transform:translateX(-50%); width:420px; height:420px; background:radial-gradient(circle, var(--gold-soft), transparent 70%); pointer-events:none; }
  .contact-card h2{ max-width:560px; margin:0 auto 0; }
  .contact-card p{ color:var(--text-dim); font-size:14.5px; margin-top:16px; max-width:440px; margin-left:auto; margin-right:auto; }
  .contact-pills{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; margin-top:36px; }
  .pill{ display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:999px; border:1px solid var(--panel-border); font-size:13.5px; font-weight:500; text-decoration:none; transition:all .3s; }
  .pill:hover{ transform:translateY(-2px); }
  .pill.gold:hover{ border-color:rgba(201,162,39,.53); box-shadow:0 8px 30px -10px rgba(201,162,39,.4); }
  .pill.blue:hover{ border-color:rgba(79,124,255,.53); box-shadow:0 8px 30px -10px rgba(79,124,255,.4); }

  footer{ position:relative; z-index:1; border-top:1px solid var(--panel-border); padding:40px 0; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:12px; }
  @media(min-width:640px){ footer{ flex-direction:row; } }
  footer span{ font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:6px; }

  [dir="rtl"] .about-p strong,[dir="rtl"] body{ letter-spacing:normal; }
  @media(prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
</style>
</head>
<body data-theme="dark">

<div class="bg-grid"></div>
<div class="blob blob-gold"></div>
<div class="blob blob-blue"></div>

<header id="site-header">
  <div class="wrap nav-inner">
    <button class="logo focus-ring" onclick="scrollToId('hero')">OCA<span>.</span></button>
    <nav class="desktop-nav" id="desktop-nav"></nav>
    <div style="display:flex; align-items:center; gap:8px; position:relative;">
      <div style="position:relative;">
        <button class="lang-btn focus-ring" id="lang-toggle" aria-label="Change language">

          <span class="mono" id="lang-current">EN</span>

        <div class="lang-menu glass" id="lang-menu"></div>
      </div>

      <button class="icon-btn focus-ring mobile-toggle" id="mobile-toggle" aria-label="Menu"></button>
    </div>
  </div>
  <div class="mobile-panel glass" id="mobile-panel"><div class="inner" id="mobile-nav"></div></div>
</header>

<main>
  <section id="hero" class="wrap">
    <div class="hero-grid">
      <div>
        <div class="eyebrow" id="hero-eyebrow"><span class="rule"></span><span></span></div>
        <h1 class="name">Omeyme Cherif<br><span class="dim">Ahmed</span></h1>

          <button class="btn-gold btn focus-ring" onclick="scrollToId('contact')">

          </div>

  </section>

  <section id="about" class="block wrap">
    <div class="about-grid">
      <div class="reveal">
        <div class="eyebrow blue"><span class="rule"></span><span id="about-eyebrow"></span></div>
        <h2 id="about-heading"></h2>
      </div>
      <div class="reveal">
        <p class="about-p" id="about-p1"></p>
        <p class="about-p" id="about-p2"></p>
        <div class="tag-row" id="about-tags"></div>
      </div>
    </div>
  </section>

  <section id="skills" class="block wrap">
    <div class="reveal">
      <div class="eyebrow"><span class="rule"></span><span id="skills-eyebrow"></span></div>
      <h2 id="skills-heading"></h2>
    </div>
    <div class="skills-grid" id="skills-grid"></div>
  </section>

  <section id="projects" class="block wrap">
    <div class="reveal">
      <div class="eyebrow blue"><span class="rule"></span><span id="projects-eyebrow"></span></div>

  <section id="education" class="block wrap">

      <div class="edu-card glass">
        <div class="edu-glow"></div>
        <div class="edu-inner">
          <div class="edu-icon"><i data-lucide="graduation-cap" style="width:24px;height:24px;"></i></div>
          <div style="flex-grow:1;">
            <h3 class="edu-title">Informatique Appliquée à la Gestion d'Entreprise <span>(MIAGE)</span></h3>

            <div class="edu-loc"><i data-lucide="map-pin" style="width:13px;height:13px;"></i><span id="edu-location"></span></div>
          </div>
          <span class="edu-status chip" id="edu-status"></span>
        </div>
      </div>
    </div>
  </section>

  <section id="certifications" class="block wrap">
    <div class="reveal">
      <div class="eyebrow blue"><span class="rule"></span><span id="certs-eyebrow"></span></div>
      <h2 id="certs-heading"></h2>
    </div>
    <div class="certs-grid" id="certs-grid"></div>

  <section id="contact" class="block wrap" style="padding-bottom:96px;">

          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="wrap">
  <span class="mono" id="footer-copy"></span>
  <span class="mono"><i data-lucide="terminal" style="width:12px;height:12px;"></i><span id="footer-tagline"></span></span>

<script>
/* ---------------------------------------------------------------- */
/* Data                                                              */
/* ---------------------------------------------------------------- */
const GOLD = "gold", BLUE = "blue";
const T_ITEMS = {
  programming: ["C","C++","Java","Python","SQL"],
  web: ["HTML5","CSS3","JavaScript","React","Next.js"],
  db: ["MySQL","PostgreSQL","MongoDB","Merise / UML"],
  business: {
    en: ["Project Management","ERP Systems","Process Analysis","Information Systems"],
    fr: ["Gestion de projet","Systèmes ERP","Analyse des processus","Systèmes d'information"],
    ar: ["إدارة المشاريع","أنظمة ERP","تحليل العمليات","نظم المعلومات"]
  },
  ai: {
    en: ["Data Analysis","Machine Learning Basics","Power BI","Statistics"],
    fr: ["Analyse de données","Bases du Machine Learning","Power BI","Statistiques"],
    ar: ["تحليل البيانات","أساسيات تعلم الآلة","Power BI","الإحصاء"]
  }
};
const SKILL_CATS = [
  { key:"programming", icon:"code-2", accent:GOLD, items:T_ITEMS.programming },
  { key:"web", icon:"globe", accent:BLUE, items:T_ITEMS.web },
  { key:"db", icon:"database", accent:GOLD, items:T_ITEMS.db },
  { key:"business", icon:"briefcase", accent:BLUE, items:null },
  { key:"ai", icon:"brain-circuit", accent:GOLD, items:null }
];

const translations = {
  en: {
    nav: { about:"About", skills:"Skills", projects:"Projects", education:"Education", certifications:"Certifications", contact:"Contact" },
    hero: { eyebrow:"Student Profile — FST, Université de Nouakchott", tagline:"Computer Science Student / Business Information Systems / Future AI Engineer", ctaContact:"Get in touch", ctaProjects:"View projects" },

const LANGS = [ {code:"en",name:"English",dir:"ltr"}, {code:"fr",name:"Français",dir:"ltr"}, {code:"ar",name:"العربية",dir:"rtl"} ];
const NAV_ORDER = ["about","skills","projects","education","certifications","contact"];

/* ---------------------------------------------------------------- */
/* State                                                             */
/* ---------------------------------------------------------------- */
let state = { lang:"en", mode:"dark", menuOpen:false, langOpen:false };

function bold(str){ return str.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>"); }
function esc(str){ const d=document.createElement("div"); d.innerText=str; return d.innerHTML; }

function scrollToId(id){
  state.menuOpen = false; renderChrome();
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
}

function setLang(code){ state.lang = code; state.langOpen = false; render(); }
function toggleTheme(){ state.mode = state.mode === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", state.mode); updateThemeIcon(); }
function updateThemeIcon(){
  const btn = document.getElementById("theme-toggle");
  btn.innerHTML = state.mode === "dark" ? '<i data-lucide="sun" style="width:15px;height:15px;"></i>' : '<i data-lucide="moon" style="width:15px;height:15px;"></i>';
  if (window.lucide) lucide.createIcons();
}

/* ---------------------------------------------------------------- */
/* Render                                                            */
/* ---------------------------------------------------------------- */
function renderChrome(){
  document.getElementById("mobile-panel").classList.toggle("open", state.menuOpen);
  document.getElementById("lang-menu").classList.toggle("open", state.langOpen);
}

function render(){
  const t = translations[state.lang];
  const dir = LANGS.find(l => l.code === state.lang).dir;
  document.documentElement.setAttribute("lang", state.lang);
  document.documentElement.setAttribute("dir", dir);
  document.body.style.fontFamily = state.lang === "ar" ? "'Cairo','Inter',sans-serif" : "'Inter',sans-serif";
  document.documentElement.style.setProperty("--font-display", state.lang === "ar" ? "'Cairo',sans-serif" : "'Poppins',sans-serif");

  // nav
  document.getElementById("desktop-nav").innerHTML = NAV_ORDER.map(id =>
    `<button class="focus-ring" onclick="scrollToId('${id}')">${esc(t.nav[id])}</button>`).join("");
  document.getElementById("mobile-nav").innerHTML = NAV_ORDER.map(id =>
    `<button class="focus-ring" onclick="scrollToId('${id}')">${esc(t.nav[id])}</button>`).join("");

  // lang switcher
  document.getElementById("lang-current").innerText = state.lang.toUpperCase();
  document.getElementById("lang-menu").style[dir === "rtl" ? "left" : "right"] = "0";
  document.getElementById("lang-menu").style[dir === "rtl" ? "right" : "left"] = "auto";
  document.getElementById("lang-menu").innerHTML = LANGS.map(l =>
    `<button class="focus-ring ${l.code === state.lang ? "active" : ""}" onclick="setLang('${l.code}')">
       <span>${l.name}</span><span class="mono" style="font-size:10px;opacity:.6;">${l.code.toUpperCase()}</span>
     </button>`).join("");

  // hero
  document.querySelector("#hero-eyebrow span:last-child").innerText = t.hero.eyebrow;
  document.getElementById("hero-tagline").innerText = t.hero.tagline;
  document.getElementById("cta-contact").innerText = t.hero.ctaContact;
  document.getElementById("cta-projects").innerText = t.hero.ctaProjects;
  document.getElementById("cta-arrow").style.transform = dir === "rtl" ? "scaleX(-1)" : "none";
  document.getElementById("id-label").innerText = t.id.label;
  document.getElementById("id-holder").innerText = t.id.holder;
  document.getElementById("id-verified").innerText = t.id.verified;

  // about
  document.getElementById("about-eyebrow").innerText = t.about.eyebrow;
  document.getElementById("about-heading").innerText = t.about.heading;
  document.getElementById("about-p1").innerHTML = bold(esc(t.about.p1).replace(/&amp;/g,'&'));
  document.getElementById("about-p2").innerHTML = bold(esc(t.about.p2).replace(/&amp;/g,'&'));
  document.getElementById("about-tags").innerHTML = t.about.tags.map(tag =>
    `<span class="glass" style="font-family:${state.lang==='ar' ? "'Cairo',sans-serif" : "'JetBrains Mono',monospace"};font-size:${state.lang==='ar'?'12.5px':'11px'};">${esc(tag)}</span>`).join("");

  // skills
  document.getElementById("skills-eyebrow").innerText = t.skills.eyebrow;
  document.getElementById("skills-heading").innerText = t.skills.heading;
  document.getElementById("skills-grid").innerHTML = SKILL_CATS.map(s => {
    const items = s.items || T_ITEMS[s.key][state.lang];
    const accentVar = s.accent === GOLD ? "var(--gold)" : "var(--blue)";
    const accentSoft = s.accent === GOLD ? "var(--gold-soft)" : "var(--blue-soft)";
    const glow = s.accent === GOLD ? "glow-gold" : "glow-blue";
    return `<div class="skill-card glass ${glow}">
      <div class="skill-icon" style="background:${accentSoft};color:${accentVar};"><i data-lucide="${s.icon}" style="width:18px;height:18px;"></i></div>
      <h3>${esc(t.skills.cats[s.key])}</h3>
      <div class="skill-tags">${items.map(it => `<span class="chip" style="font-family:${/[\u0600-\u06FF]/.test(it) ? (state.lang==='ar'?"'Cairo',sans-serif":"inherit") : "'JetBrains Mono',monospace"};">${esc(it)}</span>`).join("")}</div>
    </div>`;
  }).join("");

  // projects
  document.getElementById("projects-eyebrow").innerText = t.projects.eyebrow;
  document.getElementById("projects-heading").innerText = t.projects.heading;
  document.getElementById("projects-grid").innerHTML = t.projects.slots.map(p =>
    `<div class="project-card glass glow-gold">
      <div class="project-top"><span class="mono" style="font-size:11px;color:var(--text-faint);">${esc(p.tag)}</span>
        <div class="plus-badge"><i data-lucide="plus" style="width:14px;height:14px;"></i></div></div>
      <h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
    </div>`).join("");

  // education
  document.getElementById("education-eyebrow").innerText = t.education.eyebrow;
  document.getElementById("edu-location").innerText = t.education.location;
  document.getElementById("edu-status").innerText = t.education.status;

  // certifications
  document.getElementById("certs-eyebrow").innerText = t.certifications.eyebrow;
  document.getElementById("certs-heading").innerText = t.certifications.heading;
  document.getElementById("certs-grid").innerHTML = [1,2,3].map(() =>
    `<div class="cert-card glass"><i data-lucide="award" style="width:22px;height:22px;"></i>
      <span class="chip" style="font-family:${state.lang==='ar' ? "'Cairo',sans-serif" : "'JetBrains Mono',monospace"};font-size:${state.lang==='ar'?'12.5px':'11px'};">${esc(t.certifications.placeholder)}</span>
    </div>`).join("");

  // contact
  document.getElementById("contact-eyebrow").innerText = t.contact.eyebrow;
  document.getElementById("contact-heading").innerText = t.contact.heading;
  document.getElementById("contact-p").innerText = t.contact.p;

  // footer
  document.getElementById("footer-copy").innerText = `© ${new Date().getFullYear()} Omeyme Cherif Ahmed`;
  document.getElementById("footer-tagline").innerText = t.footer.tagline;

  // dotgrid (build once)
  const dg = document.getElementById("dotgrid");
  if (!dg.children.length){
    for (let i=0;i<48;i++){ const s=document.createElement("span"); if (Math.random()<0.42) s.style.background="transparent"; dg.appendChild(s); }
  }

  renderChrome();
  if (window.lucide) lucide.createIcons();
  observeReveals();
}

/* ---------------------------------------------------------------- */
/* Interactions                                                      */
/* ---------------------------------------------------------------- */
document.addEventListener("DOMContentLoaded", () => {
  updateThemeIcon();
  render();

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("lang-toggle").addEventListener("click", (e) => { e.stopPropagation(); state.langOpen = !state.langOpen; renderChrome(); });
  document.getElementById("mobile-toggle").addEventListener("click", () => { state.menuOpen = !state.menuOpen; renderChrome();
    document.getElementById("mobile-toggle").innerHTML = state.menuOpen ? '<i data-lucide="x" style="width:16px;height:16px;"></i>' : '<i data-lucide="menu" style="width:16px;height:16px;"></i>';
    if (window.lucide) lucide.createIcons();
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#lang-toggle") && !e.target.closest("#lang-menu")) { if (state.langOpen){ state.langOpen=false; renderChrome(); } }
  });
  window.addEventListener("scroll", () => {
    document.getElementById("site-header").classList.toggle("scrolled", window.scrollY > 24);
  });

  // ID card tilt
  const card = document.getElementById("id-card");
  const sweep = document.getElementById("id-sweep");
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduceMotion){
    card.addEventListener("mousemove", (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      const rx = py * -8, ry = px * 10;
      card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
      sweep.style.transform = `translate(${ry*3}px, ${rx*3}px)`;
    });
    card.addEventListener("mouseleave", () => { card.style.transform = "rotateX(0) rotateY(0)"; sweep.style.transform = "translate(0,0)"; });
  }

  // mobile toggle initial icon
  document.getElementById("mobile-toggle").innerHTML = '<i data-lucide="menu" style="width:16px;height:16px;"></i>';
  if (window.lucide) lucide.createIcons();
});

function observeReveals(){
  const els = document.querySelectorAll(".reveal:not(.observed)");
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) en.target.classList.add("in-view"); });
  }, { threshold:0.15, rootMargin:"-40px" });
  els.forEach(el => { el.classList.add("observed"); io.observe(el); });
}
</script>
